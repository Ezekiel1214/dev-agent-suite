<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Agent Suite</title>
<meta name="description" content="Seven AI-powered development agents — from requirements to root cause analysis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0c0e; --bg2: #131316; --bg3: #1a1a1f; --bg4: #212128;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8e8f0; --text2: #9090a8; --text3: #55556a;
    --a-story: #7c6af7; --a-plan: #2eb89a; --a-ui: #c778dd;
    --a-test: #3b9eff; --a-review: #4caf7d; --a-bug: #f0714a; --a-orch: #f5c842;
    --font-d: 'Fraunces', Georgia, serif;
    --font-b: 'DM Sans', system-ui, sans-serif;
    --font-m: 'DM Mono', monospace;
    --r: 10px; --rl: 16px;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 14px; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

  /* NAV */
  nav { border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; gap: 1.5rem; height: 54px; position: sticky; top: 0; background: rgba(12,12,14,0.96); backdrop-filter: blur(16px); z-index: 200; flex-shrink: 0; }
  .nav-logo { font-family: var(--font-d); font-weight: 300; font-size: 17px; color: var(--text); letter-spacing: -0.02em; white-space: nowrap; flex-shrink: 0; }
  .nav-logo em { font-style: italic; color: var(--a-story); }
  .nav-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab { padding: 5px 12px; border-radius: 7px; font-size: 12.5px; color: var(--text2); cursor: pointer; white-space: nowrap; border: 1px solid transparent; background: none; transition: all 0.12s; display: flex; align-items: center; gap: 5px; font-family: var(--font-b); }
  .nav-tab:hover { background: var(--bg3); color: var(--text); }
  .nav-tab.active { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .provider-switch { display: flex; align-items: center; gap: 3px; padding: 3px; border-radius: 9px; border: 1px solid var(--border2); background: var(--bg3); }
  .provider-btn { padding: 4px 10px; border-radius: 6px; border: none; background: none; color: var(--text3); font-size: 11px; cursor: pointer; font-family: var(--font-b); transition: all 0.12s; }
  .provider-btn:hover { color: var(--text); }
  .provider-btn.active { background: var(--bg4); color: var(--text); }
  .provider-btn.free.active { color: #2eb89a; }
  .api-key-btn { padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 12px; cursor: pointer; font-family: var(--font-b); transition: all 0.12s; }
  .api-key-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
  .api-key-btn.set { color: #4caf7d; border-color: rgba(76,175,125,0.3); background: rgba(76,175,125,0.08); }

  /* LAYOUT */
  .app { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { width: 240px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 1.25rem 0.75rem; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .sb-section { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text3); padding: 6px 8px 4px; margin-top: 4px; }
  .sb-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: all 0.1s; border: 1px solid transparent; }
  .sb-item:hover { background: var(--bg3); }
  .sb-item.active { background: var(--bg3); border-color: var(--border2); }
  .sb-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .sb-label { font-size: 12.5px; font-weight: 400; color: var(--text); }
  .sb-sub { font-size: 11px; color: var(--text3); }
  .sb-divider { height: 1px; background: var(--border); margin: 4px 8px; }

  /* PANELS */
  .main { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel { display: none; flex-direction: column; height: 100%; }
  .panel.active { display: flex; }

  /* PANEL HEADER */
  .ph { padding: 1.25rem 1.75rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ph-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .badge { padding: 2px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 500; font-family: var(--font-m); }
  .ph-title { font-family: var(--font-d); font-weight: 300; font-size: 20px; letter-spacing: -0.02em; color: var(--text); }
  .ph-title em { font-style: italic; }
  .ph-desc { font-size: 12.5px; color: var(--text2); max-width: 600px; }

  /* CHAT */
  .chat { flex: 1; overflow-y: auto; padding: 1.25rem 1.75rem; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
  .msg { display: flex; gap: 10px; max-width: 860px; animation: fi 0.18s ease; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .m-avatar { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; font-family: var(--font-m); }
  .msg.user .m-avatar { background: var(--bg4); color: var(--text2); border: 1px solid var(--border2); }
  .m-bubble { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--rl); padding: 11px 15px; font-size: 13.5px; line-height: 1.65; color: var(--text); max-width: 700px; word-break: break-word; }
  .msg.user .m-bubble { background: var(--bg4); border-color: var(--border2); }
  .m-bubble code { font-family: var(--font-m); font-size: 11.5px; background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 4px; }
  .m-bubble pre { background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; font-family: var(--font-m); font-size: 11.5px; line-height: 1.5; }
  .m-bubble pre code { background: none; padding: 0; }
  .json-block { margin-top: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; }
  .json-header { padding: 5px 11px; font-size: 10.5px; font-family: var(--font-m); color: var(--text3); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; }
  .jdot { width: 6px; height: 6px; border-radius: 50%; background: #4caf7d; }
  .json-block pre { margin: 0; padding: 10px 11px; font-size: 11px; }
  .dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: blink 1.1s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
  @keyframes fi { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }

  /* STREAMING cursor */
  .stream-cursor::after { content: '▍'; animation: blink 0.8s infinite; color: var(--text3); font-size: 12px; }

  /* INPUT BAR */
  .ib { padding: 0.9rem 1.75rem 1.1rem; border-top: 1px solid var(--border); flex-shrink: 0; }
  .quick-row { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .qp { padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11.5px; cursor: pointer; transition: all 0.1s; font-family: var(--font-b); }
  .qp:hover { background: var(--bg4); color: var(--text); border-color: rgba(255,255,255,0.2); }
  .iw { display: flex; gap: 7px; align-items: flex-end; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--rl); padding: 7px 7px 7px 13px; transition: border-color 0.12s; }
  .iw:focus-within { border-color: rgba(255,255,255,0.22); }
  .it { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-b); font-size: 13.5px; line-height: 1.5; resize: none; min-height: 21px; max-height: 150px; overflow-y: auto; scrollbar-width: none; }
  .it::placeholder { color: var(--text3); }
  .sb-btn { width: 32px; height: 32px; border-radius: 7px; background: var(--text); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.1s; color: var(--bg); }
  .sb-btn:hover { opacity: 0.82; transform: scale(0.96); }
  .sb-btn:disabled { opacity: 0.28; cursor: not-allowed; transform: none; }
  .sb-btn svg { width: 14px; height: 14px; }
  .ib-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .ib-model { font-size: 11px; color: var(--text3); font-family: var(--font-m); }
  .clear-btn { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--font-b); transition: color 0.1s; }
  .clear-btn:hover { color: var(--text2); }

  /* API KEY MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: flex; align-items: center; justify-content: center; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--rl); padding: 1.75rem; width: 420px; max-width: calc(100vw - 2rem); }
  .modal-title { font-family: var(--font-d); font-weight: 300; font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.55; }
  .modal-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: var(--font-m); font-size: 13px; outline: none; transition: border-color 0.12s; }
  .modal-input:focus { border-color: rgba(255,255,255,0.25); }
  .modal-row { display: flex; gap: 8px; margin-top: 1rem; }
  .modal-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border2); background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-b); transition: opacity 0.1s; }
  .modal-btn:hover { opacity: 0.88; }
  .modal-btn.cancel { background: none; color: var(--text2); }
  .modal-note { font-size: 11px; color: var(--text3); margin-top: 10px; line-height: 1.5; }

  /* HOME */
  .home-panel { flex: 1; padding: 2.5rem 1.75rem; overflow-y: auto; }
  .home-hero { max-width: 580px; margin-bottom: 2.5rem; }
  .home-title { font-family: var(--font-d); font-weight: 300; font-size: 38px; letter-spacing: -0.03em; line-height: 1.08; margin-bottom: 1rem; color: var(--text); }
  .home-title em { font-style: italic; }
  .home-sub { font-size: 14.5px; color: var(--text2); line-height: 1.7; max-width: 480px; }
  .section-hd { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; margin-bottom: 2rem; }
  .ac { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 1.15rem; cursor: pointer; transition: all 0.13s; display: flex; flex-direction: column; gap: 9px; }
  .ac:hover { background: var(--bg3); border-color: var(--border2); transform: translateY(-1px); }
  .ac-top { display: flex; align-items: center; gap: 9px; }
  .ac-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .ac-name { font-size: 13px; font-weight: 500; color: var(--text); font-family: var(--font-m); }
  .ac-model { font-size: 10.5px; color: var(--text3); }
  .ac-desc { font-size: 12.5px; color: var(--text2); line-height: 1.5; }
  .ac-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { padding: 2px 7px; border-radius: 4px; font-size: 10.5px; font-family: var(--font-m); background: rgba(255,255,255,0.05); color: var(--text3); border: 1px solid var(--border); }
  .wf-cards { display: flex; flex-direction: column; gap: 7px; margin-bottom: 2rem; }
  .wfc { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 0.9rem 1.15rem; cursor: pointer; transition: all 0.13s; display: flex; align-items: flex-start; gap: 11px; }
  .wfc:hover { background: var(--bg3); border-color: var(--border2); }
  .wfc-lbl { background: var(--bg4); border-radius: 6px; padding: 2px 8px; font-size: 10.5px; font-family: var(--font-m); color: var(--text3); white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
  .wfc-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .wfc-flow { font-size: 11px; color: var(--text3); font-family: var(--font-m); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

  @media (max-width: 720px) {
    .sidebar { display: none; }
    nav { padding: 0 1rem; }
    .ph, .chat, .ib { padding-left: 1rem; padding-right: 1rem; }
    .home-panel { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Dev<em>Agent</em></div>
  <div class="nav-tabs" id="navTabs"></div>
  <div class="nav-right">
    <div class="provider-switch">
      <button class="provider-btn" id="providerTrialBtn" onclick="setProvider('trial')">Hosted Trial</button>
      <button class="provider-btn free" id="providerGeminiBtn" onclick="setProvider('gemini')">Gemini Free</button>
      <button class="provider-btn" id="providerAnthropicBtn" onclick="setProvider('anthropic')">Anthropic</button>
    </div>
    <button class="api-key-btn" id="apiKeyBtn" onclick="showApiModal()">Set API Key</button>
  </div>
</nav>

<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="modal-overlay hidden" id="apiModal">
  <div class="modal">
    <div class="modal-title" id="apiModalTitle">API Key</div>
    <div class="modal-sub" id="apiModalSub">Your key is stored only in this browser session.</div>
    <input class="modal-input" type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off" onkeydown="if(event.key==='Enter')saveApiKey()">
    <div class="modal-row">
      <button class="modal-btn cancel" onclick="hideApiModal()">Cancel</button>
      <button class="modal-btn" onclick="saveApiKey()">Save Key</button>
    </div>
    <div class="modal-note" id="apiModalNote">Get your key from the provider console.</div>
  </div>
</div>

<script>
// ─── AGENT DEFINITIONS ────────────────────────────────────────────────
const AGENTS = [
  {
    id: 'orchestrator', label: 'Orchestrator', emoji: '◈', color: '#f5c842',
    model: 'claude-sonnet-4-6', badge: 'coordinator',
    desc: 'Master workflow coordinator. Routes work between all agents, manages handoffs, tracks progress, and maintains workflow state.',
    shortDesc: 'Coordinates all agents',
    tags: ['workflow A', 'workflow B', 'workflow C', 'workflow D'],
    quickPrompts: ['Plan a new notifications feature end-to-end','Run Workflow A: full feature pipeline','Debug a race condition — full fix workflow','Which workflow should I use for a bug fix?'],
    systemPrompt: `You are the master workflow coordinator for a professional development agent suite.

AGENT ROSTER:
- story-generator → feature_brief.json (Requirements → user stories + GWT criteria)
- dev-planner → dev_plan_summary.json (Stories → tasks, timelines, risk register)
- ui-sketcher → ui_spec.json (Requirements → ASCII wireframes + interaction flows)
- test-writer → test_report.json (Stories + code → test suite with AC coverage)
- code-reviewer → review_report.json (Code → severity-classified findings)
- bug-analyzer → bug_report.json (Error + code → root cause + fix)

STANDARD WORKFLOWS:
Workflow A (New Feature): story-generator → dev-planner + ui-sketcher (parallel) → [user implements] → test-writer → code-reviewer
Workflow B (Bug Fix): bug-analyzer → test-writer (regression) → code-reviewer (validate fix)
Workflow C (Code Review): code-reviewer → if critical findings → bug-analyzer
Workflow D (Requirements only): story-generator → dev-planner + ui-sketcher (parallel)

RULES:
- Always show a workflow status table at the top of each response
- Halt and ask the user before proceeding past any critical finding
- Never skip an agent without explicit user confirmation
- Pass JSON schema blocks verbatim between agents — never paraphrase them
- End every response with workflow_state.json

Produce clear, structured, professional output. Use markdown tables and headers.`
  },
  {
    id: 'story-generator', label: 'Story Generator', emoji: '✦', color: '#7c6af7',
    model: 'claude-sonnet-4-6', badge: 'spec',
    desc: 'Transforms requirements, PRDs, git diffs, or raw descriptions into structured user stories with GWT acceptance criteria and a feature_brief.json schema block.',
    shortDesc: 'Requirements → user stories',
    tags: ['feature_brief.json', 'GWT criteria', 'personas', 'complexity'],
    quickPrompts: ['Generate stories for a user authentication feature','Turn this into stories: users can upload and crop profile photos','Create stories for a shopping cart with discount codes','Generate stories for a real-time notification system'],
    systemPrompt: `You are a Senior Product Analyst specializing in translating requirements into structured user stories with acceptance criteria.

RULES:
- Never include technical implementation details — focus only on user-facing behavior
- Generate 3–8 independent user stories per feature
- Each story: "As a [persona], I want [goal], so that [benefit]"
- Each story has 2–4 GWT acceptance criteria (Given / When / Then)
- Assign priority: high / medium / low
- Assign complexity: XS / S / M / L / XL
- Stories must be independently testable and deliverable
- Generate from broadest (happy path) to narrowest (error states, edge cases)

OUTPUT FORMAT:
1. One markdown section per story with heading, As/I Want/So That, priority, complexity
2. GWT acceptance criteria as Given/When/Then blocks
3. End with feature_brief.json containing all stories structured as:
{"feature_brief": {"feature_name": "...", "generated_at": "...", "stories": [{"id": "STORY-001", "title": "...", "persona": "...", "goal": "...", "benefit": "...", "acceptance_criteria": [{"id": "AC-001-01", "given": "...", "when": "...", "then": "..."}], "priority": "high|medium|low", "estimated_complexity": "XS|S|M|L|XL"}]}}`
  },
  {
    id: 'dev-planner', label: 'Dev Planner', emoji: '◎', color: '#2eb89a',
    model: 'claude-sonnet-4-6', badge: 'planning',
    desc: 'Breaks user stories into detailed development plans with task decomposition, dependency mapping, timeline estimation, library research, and risk analysis.',
    shortDesc: 'Stories → dev roadmap',
    tags: ['task breakdown', 'timelines', 'risk matrix', 'libraries'],
    quickPrompts: ['Plan development for a JWT authentication system','Create a roadmap for a file upload and storage feature','Break down a Stripe payment integration into tasks','Plan a WebSocket real-time chat feature'],
    systemPrompt: `You are an expert Development Planning specialist. You translate requirements into structured, actionable development plans.

CRITICAL: You do NOT write code. You produce plans, specifications, and task breakdowns only.

INPUT: Accept feature_brief.json from story-generator, or raw requirements.

OUTPUT STRUCTURE:
1. Scope: in-scope list, out-of-scope list, assumptions
2. Technical architecture: components, data flow, integration points, tech stack
3. Recommended libraries table: name | purpose | last updated | stars | license — prefer actively maintained solutions (last commit < 6 months). Flag any library last updated > 1 year.
4. Task breakdown by phase: each task has estimate (hours ±confidence), role, priority H/M/L, measurable acceptance criteria, dependencies
5. Risk register table: risk | probability H/M/L | impact H/M/L | mitigation action | owner
6. Resource summary: total hours range, skills needed, external dependencies
7. Milestones table: name | target (day N) | criteria

End with dev_plan_summary.json:
{"dev_plan_summary": {"feature_name": "...", "source_story_ids": [], "total_tasks": 0, "estimated_hours_min": 0, "estimated_hours_max": 0, "phases": [], "top_risks": [], "recommended_libraries": []}}`
  },
  {
    id: 'ui-sketcher', label: 'UI Sketcher', emoji: '⬡', color: '#c778dd',
    model: 'claude-sonnet-4-6', badge: 'design',
    desc: 'Produces ASCII wireframes, interaction state diagrams, and step-by-step user journeys from any requirement — even a single sentence.',
    shortDesc: 'Requirements → UI blueprint',
    tags: ['ASCII wireframes', 'interaction flows', 'user journeys', 'states'],
    quickPrompts: ['Sketch a multi-step checkout flow','Design a data analytics dashboard','Draw a login and password-reset screen pair','Sketch a notifications settings page'],
    systemPrompt: `You are a Universal UI Blueprint Engineer specializing in ASCII interface design and interaction specification.

CRITICAL: You do NOT write code. You produce blueprints, flows, and specifications only.

INPUT: Accept feature_brief.json from story-generator, or raw requirements.

MANDATORY SECTIONS — produce all four in every response:

SECTION 1 — User story (if not already provided):
AS A [user type] / I WANT TO [goal] / SO THAT [value]
Acceptance criteria: ✓ [measurable outcome] (minimum 3)

SECTION 2 — ASCII interface design:
Use box-drawing chars: ┌─┐│└┘├┤╔═╗║╚╝▼◐✓⚠
Show: spatial layout, component hierarchy, all interactive elements, placeholder content

SECTION 3 — Interaction flow with at minimum 2 named states:
STATE: [Name]
[ASCII diagram]
── [user action] ──>
STATE: [Name]
[ASCII diagram]

SECTION 4 — Step-by-step user journey (numbered, include error path):
1. Entry point: ...
2. Initial view: ...
3. Primary action: ...
4. System response: ...
5. Error state: ...
6. Success state: ...

End with ui_spec.json:
{"ui_spec": {"feature_name": "...", "source_story_ids": [], "screens": [], "components": [], "states": ["initial","loading","success","error"], "key_interactions": []}}`
  },
  {
    id: 'test-writer', label: 'Test Writer', emoji: '◉', color: '#3b9eff',
    model: 'claude-sonnet-4-6', badge: 'qa',
    desc: 'Generates unit, integration, and e2e test suites from acceptance criteria or code. Maps every GWT criterion to a labelled, runnable test case.',

async function send(agentId) {
  if (currentProvider().requiresKey && !currentApiKey()) { showApiModal(); return; }
  const inp = document.getElementById(`inp-${agentId}`);
  const btn = document.getElementById(`sbtn-${agentId}`);
  const text = inp.value.trim();
  if (!text) return;
  const agent = AGENTS.find(a => a.id === agentId);
  const chat = document.getElementById(`chat-${agentId}`);

  inp.value = ''; inp.style.height = 'auto'; btn.disabled = true;
  appendMsg(chat, 'user', text, agent);

  const thinkEl = appendMsg(chat, 'agent', null, agent);
  thinkEl.querySelector('.m-bubble').innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  chat.scrollTop = chat.scrollHeight;

  convos[agentId].push({ role: 'user', content: text });

  try {
    const content = providerId === 'trial'
      ? await sendTrial(agent, convos[agentId])
      : providerId === 'gemini'
        ? await sendGemini(agent, convos[agentId])
        : await sendAnthropic(agent, convos[agentId]);
    thinkEl.querySelector('.m-bubble').innerHTML = renderMd(content);
    convos[agentId].push({ role: 'assistant', content });
  } catch (err) {
    thinkEl.querySelector('.m-bubble').innerHTML = `<span style="color:#f0714a">Error: ${esc(err.message)}</span>`;
  }

  btn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

async function sendAnthropic(agent, messages) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': currentApiKey(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: agent.model,
      max_tokens: 4096,
      system: agent.systemPrompt,
      messages
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.content?.[0]?.text || 'No response received.';
}

async function sendGemini(agent, messages) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(currentApiKey())}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: agent.systemPrompt }] },
      contents: messages.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      })),
      generationConfig: {
        maxOutputTokens: 4096,
        temperature: 0.2
      }
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  const content = (data.candidates?.[0]?.content?.parts || [])
    .map(part => part.text || '')
    .join('')
    .trim();
  return content || 'No response received.';
}

async function sendTrial(agent, messages) {
  if (!TRIAL_API_BASE) throw new Error('Hosted trial endpoint is not configured.');
  const res = await fetch(`${TRIAL_API_BASE}/api/trial-chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      agentId: agent.id,
      system: agent.systemPrompt,
      messages,
      maxTokens: 768
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error || err?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.content || 'No response received.';
}

function appendMsg(chat, type, text, agent) {

  }
  chat.appendChild(d);
  return d;
}

// ─── MARKDOWN RENDERER ────────────────────────────────────────────────
function renderMd(raw) {
  let t = raw;
  // JSON blocks
  t = t.replace(/```json\n?([\s\S]*?)```/g, (_,c) =>
    `<div class="json-block"><div class="json-header"><span class="jdot"></span>json output</div><pre><code>${esc(c.trim())}</code></pre></div>`);
  // Code blocks
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) =>
    `<pre><code>${esc(c.trim())}</code></pre>`);
  // Inline code
  t = t.replace(/`([^`\n]+)`/g, (_,c) => `<code>${esc(c)}</code>`);
  // Bold
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  // Headings
  t = t.replace(/^#### (.+)$/gm, '<div style="font-size:12.5px;font-weight:500;color:var(--text);margin:10px 0 3px">$1</div>');
  t = t.replace(/^### (.+)$/gm, '<div style="font-size:13px;font-weight:500;color:var(--text);margin:12px 0 4px">$1</div>');
  t = t.replace(/^## (.+)$/gm, '<div style="font-size:14px;font-weight:500;color:var(--text);margin:14px 0 5px;padding-bottom:4px;border-bottom:1px solid var(--border)">$1</div>');
  t = t.replace(/^# (.+)$/gm, '<div style="font-size:15px;font-weight:500;color:var(--text);margin:16px 0 7px">$1</div>');
  // Table (markdown pipe tables)
  t = t.replace(/((?:\|.+\|\n?)+)/g, match => {
    const rows = match.trim().split('\n').filter(r => !/^\|[\s:|-]+\|$/.test(r));
    if (rows.length < 1) return match;
    return `<div style="overflow-x:auto;margin:8px 0"><table style="width:100%;border-collapse:collapse;font-size:12px;font-family:var(--font-m)">${
      rows.map((r,i) => {
        const cells = r.split('|').slice(1,-1);
        const tag = i === 0 ? 'th' : 'td';
        const style = `padding:5px 10px;border:1px solid var(--border);text-align:left;${i===0?'background:var(--bg4);color:var(--text2)':'color:var(--text)'}`;
        return `<tr>${cells.map(c => `<${tag} style="${style}">${c.trim()}</${tag}>`).join('')}</tr>`;
      }).join('')
    }</table></div>`;
  });
  // Checkboxes
  t = t.replace(/^- \[ \] (.+)$/gm, '<div style="display:flex;gap:7px;align-items:flex-start;margin:2px 0"><span style="color:var(--text3);font-size:11px;font-family:var(--font-m);flex-shrink:0;margin-top:3px">☐</span><span>$1</span></div>');
  t = t.replace(/^- \[x\] (.+)$/gim, '<div style="display:flex;gap:7px;align-items:flex-start;margin:2px 0"><span style="color:#4caf7d;font-size:11px;flex-shrink:0;margin-top:3px">☑</span><span>$1</span></div>');
  // Bullets
  t = t.replace(/^[-*] (.+)$/gm, '<div style="display:flex;gap:8px;margin:2px 0"><span style="color:var(--text3);flex-shrink:0;margin-top:2px">–</span><span>$1</span></div>');
  // Numbered lists
  t = t.replace(/^(\d+)\. (.+)$/gm, '<div style="display:flex;gap:8px;margin:2px 0"><span style="color:var(--text3);flex-shrink:0;font-family:var(--font-m);font-size:11px;margin-top:3px">$1.</span><span>$2</span></div>');
  // Horizontal rule
  t = t.replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0">');
  // Line breaks
  t = t.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
  return t;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── INIT ─────────────────────────────────────────────────────────────
buildNav(); buildSidebar(); buildPanels();
</script>
